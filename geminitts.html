<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini TTS Test</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    input, textarea, select, button {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        margin-bottom: 18px;
        padding: 12px;
        font-size: 16px;
    }

    textarea {
        height: 120px;
    }

    button {
        cursor: pointer;
        background: #333;
        color: white;
        border: 0;
        border-radius: 6px;
    }

    button:disabled {
        opacity: 0.5;
    }

    #status {
        white-space: pre-wrap;
        margin-top: 10px;
    }
</style>
</head>

<body>

<h1>Gemini TTS Test</h1>

<label>Gemini API Key</label>
<input
    id="apiKey"
    type="password"
    placeholder="Paste your Gemini API key"
>

<label>Text</label>
<textarea id="text">你好，很高兴认识你。</textarea>

<label>Voice</label>
<select id="voice">
    <option value="Kore">Kore</option>
    <option value="Puck">Puck</option>
    <option value="Charon">Charon</option>
    <option value="Fenrir">Fenrir</option>
    <option value="Aoede">Aoede</option>
</select>

<button id="generate">Generate & Play</button>

<div id="status"></div>

<script>
const MODEL = "gemini-2.5-flash-preview-tts";

document.getElementById("generate").onclick = async () => {

    const apiKey = document.getElementById("apiKey").value.trim();
    const text = document.getElementById("text").value;
    const voice = document.getElementById("voice").value;
    const status = document.getElementById("status");
    const button = document.getElementById("generate");

    if (!apiKey) {
        status.textContent = "Please enter your API key.";
        return;
    }

    if (!text.trim()) {
        status.textContent = "Please enter some text.";
        return;
    }

    button.disabled = true;
    status.textContent = "Generating...";

    try {

        const url =
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                contents: [
                    {
                        parts: [
                            {
                                text: text
                            }
                        ]
                    }
                ],

                generationConfig: {
                    responseModalities: ["AUDIO"],

                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: {
                                voiceName: voice
                            }
                        }
                    }
                }
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                JSON.stringify(data)
            );
        }

        const base64Audio =
            data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

        if (!base64Audio) {
            throw new Error("No audio returned.");
        }

        const pcm = base64ToUint8Array(base64Audio);

        // Gemini TTS returns 24 kHz, 16-bit PCM
        const wav = pcmToWav(pcm, 24000, 1);

        const blob = new Blob([wav], {
            type: "audio/wav"
        });

        const audioURL = URL.createObjectURL(blob);

        const audio = new Audio(audioURL);
        await audio.play();

        status.textContent = "Playing.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error:\n" + error.message;

    } finally {
        button.disabled = false;
    }
};


function base64ToUint8Array(base64) {

    const binary = atob(base64);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}


function pcmToWav(pcm, sampleRate, channels) {

    const buffer = new ArrayBuffer(44 + pcm.length);
    const view = new DataView(buffer);

    writeString(view, 0, "RIFF");
    view.setUint32(4, 36 + pcm.length, true);
    writeString(view, 8, "WAVE");

    writeString(view, 12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, channels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * channels * 2, true);
    view.setUint16(32, channels * 2, true);
    view.setUint16(34, 16, true);

    writeString(view, 36, "data");
    view.setUint32(40, pcm.length, true);

    new Uint8Array(buffer, 44).set(pcm);

    return buffer;
}


function writeString(view, offset, string) {

    for (let i = 0; i < string.length; i++) {
        view.setUint8(
            offset + i,
            string.charCodeAt(i)
        );
    }
}
</script>

</body>
</html>
